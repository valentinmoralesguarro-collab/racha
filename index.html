<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Racha</title>
<meta name="theme-color" content="#171a33">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Racha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#171a33;--bg2:#1f2347;--card:#262b57;--card2:#313775;--ink:#f3f4ff;--mut:#9aa0cf;--line:#3a4080;
--gold:#ffc83d;--gold2:#c98f00;--green:#5fd068;--green2:#37a043;--red:#ff6b6b;--red2:#bf4343;--blue:#4cc9f0;--blue2:#2a8fb0;--orange:#ff8a3d;--lock:#2b2f5c;--lock2:#1d2048}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:600 16px/1.35 ui-rounded,"SF Pro Rounded","Avenir Next Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 50% -100px,#2b3170 0,transparent 70%),var(--bg);min-height:100vh;
padding:calc(70px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
main{max-width:520px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;margin:4px 0 12px;font-weight:900}
h2{font-size:13px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;border:2px solid var(--line);border-bottom-width:5px}
/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.hud .in{max-width:520px;margin:0 auto;width:100%;display:flex;gap:10px;align-items:center}
.pill{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 10px;font-weight:900;white-space:nowrap}
.pill.fire{color:var(--orange)}.pill.fire.off{color:var(--mut)}.pill.ice{color:var(--blue)}
.lvl{flex:1;min-width:0}.lvlt{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}.lvlt b{color:var(--gold)}
.bar{height:12px;background:var(--lock2);border-radius:99px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe27a);border-radius:99px;transition:width .5s}
.bar.g i{background:linear-gradient(90deg,var(--green),#9af09f)}
/* Buttons */
.btn{display:block;width:100%;text-align:center;text-decoration:none;cursor:pointer;background:var(--green);color:#0d2a11;border:0;border-bottom:5px solid var(--green2);border-radius:16px;padding:13px 16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.btn:active{transform:translateY(4px);border-bottom-width:1px}
.btn.gold{background:var(--gold);border-bottom-color:var(--gold2);color:#3b2a00}
.btn.blue{background:var(--blue);border-bottom-color:var(--blue2);color:#062a36}
.btn.red{background:var(--red);border-bottom-color:var(--red2);color:#3a0909}
.btn.dim{background:var(--card2);border-bottom-color:var(--lock2);color:var(--ink)}
.btn[disabled]{background:var(--lock);border-bottom-color:var(--lock2);color:var(--mut);cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px 10px;font-weight:800}
input,select{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--blue)}
.stack{display:grid;gap:10px;margin-top:10px}
/* Sheep */
.sheepbox{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;flex:1;font-weight:700}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.sheep{animation:bob 3s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-4px)}}
/* Dios */
.dios{background:linear-gradient(160deg,#3a3270,#262b57);border-color:#7a6bd0}
.dios b{color:#ffe9a8;font-size:17px}
/* Quests */
.q{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--bg2);border:2px solid var(--line);border-bottom-width:4px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.q .ck{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;flex:none;color:transparent}
.q.done{border-color:var(--green2);background:#1f4a3a}.q.done .ck{background:var(--green);border-color:var(--green);color:#0d2a11}
.q .t{flex:1}.q.done .t{text-decoration:line-through;opacity:.8}
.xp{background:#4b3d0a;color:var(--gold);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:900}
.q.done .xp{background:#1a5a35;color:#9af09f}
.chest{font-size:40px;line-height:1}
.chestbtn{display:flex;gap:12px;align-items:center}
.glow{animation:glow 1.2s ease-in-out infinite}@keyframes glow{50%{transform:scale(1.04);filter:brightness(1.15)}}
/* Path */
.path{display:flex;flex-direction:column;align-items:center;gap:6px}
.week{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin:14px 0 4px;display:flex;align-items:center;gap:10px;width:100%}
.week:before,.week:after{content:"";flex:1;height:2px;background:var(--line)}
.node{width:92px;text-align:center;background:none;border:0;cursor:pointer;padding:0}
.node .c{width:84px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;margin:0 auto;background:var(--green);border-bottom:7px solid var(--green2);box-shadow:0 0 0 6px rgba(95,208,104,.18)}
.node:active .c{transform:translateY(4px);border-bottom-width:3px}
.node.gold .c{background:var(--gold);border-bottom-color:var(--gold2);box-shadow:0 0 0 6px rgba(255,200,61,.18)}
.node.lock{cursor:default}.node.lock .c{background:var(--lock);border-bottom-color:var(--lock2);box-shadow:none;filter:grayscale(.7);opacity:.85}
.node small{display:block;margin-top:6px;font-weight:800;font-size:12px}
.node:nth-child(odd){transform:translateX(-34px)}.node:nth-child(even){transform:translateX(34px)}
/* Badges */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer}
.bd .m{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 30%,#ffe27a,var(--gold));border-bottom:4px solid var(--gold2)}
.bd.off .m{background:var(--lock);border-bottom-color:var(--lock2);filter:grayscale(1);opacity:.55}
.bd b{display:block;font-size:12px;line-height:1.15}.bd .bar{height:6px;margin:6px 8px 0}
/* Plata */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:16px;padding:4px;gap:4px;margin-bottom:8px}
.seg button{border:0;border-radius:12px;padding:10px;background:none;font-weight:900;cursor:pointer;color:var(--mut)}
.seg button.on.g{background:var(--red);color:#3a0909}.seg button.on.i{background:var(--green);color:#0d2a11}.seg button.on.t{background:var(--blue);color:#062a36}
.amount{text-align:center;font-size:40px;font-weight:900;padding:0 0 6px;letter-spacing:-.02em}
.amount small{font-size:22px;color:var(--mut);margin-right:4px}
.chips{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap}
.chip{border:2px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 12px;cursor:pointer;font-weight:800;font-size:14px}
.chip.on{background:var(--blue);color:#062a36;border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.pad button{background:var(--card2);border:0;border-bottom:4px solid var(--lock2);border-radius:14px;padding:9px 0;font-size:21px;font-weight:900;cursor:pointer}
.pad button:active{transform:translateY(3px);border-bottom-width:1px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum b{display:block;font-size:18px}
.pos{color:var(--green)}.neg{color:var(--red)}
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}.mv:last-child{border:0}
.mv .t{flex:1;min-width:0}.mv .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.cat .bar{flex:1;margin:0}.cat i{background:var(--red)!important}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:520px}
.nav button{background:none;border:2px solid transparent;border-radius:14px;padding:6px 0;cursor:pointer;color:var(--mut);font-size:10px;font-weight:900;display:grid;gap:2px;justify-items:center}
.nav button span{font-size:24px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--blue);background:#233a7a;border-color:var(--blue2)}.nav button.on span{filter:none;opacity:1}
/* Modal, toast, confetti */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,30,.8);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.mbox{background:var(--card);border:3px solid var(--gold);border-bottom-width:7px;border-radius:26px;padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mbox .big{font-size:64px;line-height:1.1}.mbox h3{margin:6px 0 4px;font-size:22px;color:var(--gold);font-weight:900}.mbox p{margin:0 0 16px;color:var(--mut)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-30px);opacity:0;background:var(--gold);color:#3b2a00;font-weight:900;padding:9px 16px;border-radius:99px;z-index:15;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
.acc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acc button{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 2px;cursor:pointer;font-size:24px;display:grid;gap:2px;justify-items:center}
.acc button small{font-size:10px;font-weight:800;color:var(--mut)}.acc button.on{border-color:var(--gold);background:#3b3470}.acc button.lk{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:var(--bg2);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:22px}
.er{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.er input.e{width:50px;text-align:center;flex:none;padding:10px 2px;font-size:18px}.er input.n{flex:1;min-width:0}
.er select{width:auto;flex:none;padding:10px 6px}
.ib{background:var(--card2);border:0;border-bottom:3px solid var(--lock2);border-radius:10px;width:34px;height:40px;cursor:pointer;flex:none;font-weight:900}
.ib:disabled{opacity:.3;cursor:default}.ib.del{color:var(--red)}
.blk{padding-bottom:6px;margin-bottom:10px;border-bottom:2px solid var(--line)}.blk:last-child{border:0;margin-bottom:0}
.amts{display:flex;gap:8px;margin-bottom:6px}
.amt{flex:1;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:5px 8px;text-align:center;cursor:pointer;font-weight:900;font-size:24px}
.amt.on{border-color:var(--blue)}.amt small{font-size:14px;color:var(--mut);margin-right:3px}.amt .mut{display:block;font-size:11px;font-weight:700}
.rate{text-align:center;font-size:12px;color:var(--mut);min-height:16px;margin-bottom:4px}
.petbtn{background:none;border:0;padding:0;cursor:pointer;flex:none;display:block;margin:0 auto}
.petbtn.l{margin:0}.bubble.nb:before{display:none}
@keyframes boing{30%{transform:scale(1.14,.88)}60%{transform:scale(.93,1.1)}}.sheep.boing{animation:boing .5s}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}.cols.days{gap:2px}
.col{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.col i{flex:1;border-radius:5px 5px 0 0}.col i.g{background:var(--red)}.col i.i{background:var(--green)}
.labs{display:flex;gap:8px;margin-top:4px}.labs span{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:800}
.cat.ing i{background:var(--green)!important}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:4px}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hdr{font-size:11px;color:var(--mut);text-align:center;font-weight:800;padding:2px 0}
.dc{aspect-ratio:1;border-radius:10px;border:2px solid transparent;display:grid;place-items:center;font-weight:800;font-size:13px;background:none;padding:0;color:var(--ink);font-family:inherit}
button.dc{cursor:pointer}
.dc.done{background:var(--green);color:#0d2a11}.dc.missed{background:rgba(255,107,107,.2);color:var(--red)}.dc.skip{background:rgba(255,200,61,.2);color:var(--gold)}
.dc.rest{background:var(--bg2);color:var(--mut);opacity:.7}.dc.future,.dc.none{color:var(--mut);opacity:.35}.dc.pending{border-color:var(--blue);color:var(--blue)}.dc.today{box-shadow:0 0 0 2px var(--blue)}
.wk{display:grid;grid-template-columns:104px repeat(7,1fr);gap:4px;align-items:center}.wk .dc{aspect-ratio:auto;height:28px;border-radius:8px;font-size:12px}
.wk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.dchips{display:flex;gap:5px;align-items:center}
.dch{flex:1;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);font-weight:900;cursor:pointer;color:var(--mut);font-size:12px;padding:0}
.dch.on{background:var(--green);border-color:var(--green2);color:#0d2a11}
.ghost:disabled{opacity:.3;cursor:default}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qfrow{display:flex;gap:8px;margin-bottom:8px;align-items:stretch}.qfrow select{flex:1;min-width:0}
.amtbox{flex:1;display:flex;align-items:center;gap:4px;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding-left:12px;min-width:0}
.amtbox:focus-within{border-color:var(--blue)}.amtbox span{color:var(--mut);font-weight:900}
.amtbox input{border:0;background:none;flex:1;min-width:0;padding:11px 8px 11px 2px}
.srow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.srow .ic{font-size:30px}.srow .tx{flex:1;min-width:0}.srow b{font-size:17px}.srow small{display:block;color:var(--mut);font-weight:600;font-size:13px}.srow .ch{color:var(--mut);font-size:26px}
.wkh{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin:14px 2px 6px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.prow .ic{font-size:24px;width:30px;text-align:center}.prow .tx{flex:1;min-width:0}.prow b{font-size:15px}.prow small{display:block;color:var(--mut);font-weight:600;font-size:12px}.prow .ch{color:var(--mut);font-size:22px}
.prow.lock{background:var(--lock);border-color:var(--lock2);color:var(--mut);cursor:default}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px solid var(--line)}.tk:last-child{border:0}
.ck2{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);background:none;color:transparent;font-weight:900;cursor:pointer;flex:none;display:grid;place-items:center;margin-top:2px;padding:0}
.tk.done .ck2{background:var(--green);border-color:var(--green);color:#0d2a11}.tk.done .tx2{text-decoration:line-through;opacity:.7}
.tt{flex:1;min-width:0}.tx2{font-weight:800;word-break:break-word}
.tact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{background:var(--card2);border:0;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--ink);text-decoration:none;cursor:pointer;display:inline-block;font-family:inherit}.mini.del{color:var(--red)}
.qfrow input[type=date],.qfrow input[type=time]{flex:1;min-width:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<canvas id="cf"></canvas>
<script>
/* ===== Configuración ===== */
// Días ACTIVOS (días en que hiciste algo, no hace falta que sean seguidos) para desbloquear cada cosa
const UNLOCK = {habitos:0, plata:0, tareas:0, comida:7, gym:7};
const XP = {habit:10, meal:5, gym:20, money:5, first:5, chest:25, task:10};
const GYM_META = 3; // entrenos por semana
const TITLES = [[10,'Oveja legendaria'],[7,'Oveja fuerte'],[4,'Oveja firme'],[2,'Ovejita'],[1,'Corderito']];
const ACCS = [
  {id:'gorro',n:'Gorro',e:'🧢',slot:'hat',lv:2},
  {id:'lentes',n:'Lentes',e:'🕶️',slot:'face',lv:3},
  {id:'bufanda',n:'Bufanda',e:'🧣',slot:'neck',lv:5},
  {id:'corona',n:'Corona',e:'👑',slot:'hat',lv:8}
];
const BADGES = [
  {id:'b1',e:'🌟',n:'Primer paso',d:'Hacé tu primera acción',p:s=>[s.activeDays.length,1]},
  {id:'r3',e:'🔥',n:'Racha de 3',d:'3 días seguidos',p:s=>[s.best,3]},
  {id:'r7',e:'🔥',n:'Racha de 7',d:'Una semana seguida',p:s=>[s.best,7]},
  {id:'r14',e:'⚡',n:'Racha de 14',d:'Dos semanas seguidas',p:s=>[s.best,14]},
  {id:'r30',e:'👑',n:'Racha de 30',d:'Un mes seguido',p:s=>[s.best,30]},
  {id:'d7',e:'📅',n:'Semana activa',d:'7 días activos en total',p:s=>[s.activeDays.length,7]},
  {id:'h30',e:'🌱',n:'Hábitos x30',d:'30 hábitos cumplidos',p:s=>[habitTotal(),30]},
  {id:'h100',e:'🌳',n:'Hábitos x100',d:'100 hábitos cumplidos',p:s=>[habitTotal(),100]},
  {id:'hs7',e:'🔗',n:'Hábito en racha',d:'7 veces seguidas cumpliendo un mismo hábito',p:s=>[maxHabitBest(),7]},
  {id:'hs21',e:'⛓️',n:'Hábito de hierro',d:'21 veces seguidas cumpliendo un mismo hábito',p:s=>[maxHabitBest(),21]},
  {id:'t10',e:'✅',n:'Tareas x10',d:'10 tareas hechas',p:s=>[s.tasks.filter(t=>t.done).length,10]},
  {id:'t50',e:'📋',n:'Tareas x50',d:'50 tareas hechas',p:s=>[s.tasks.filter(t=>t.done).length,50]},
  {id:'c5',e:'🎁',n:'Cofres x5',d:'Abrí 5 cofres diarios',p:s=>[s.chests,5]},
  {id:'l3',e:'🎖️',n:'Nivel 3',d:'Llegá al nivel 3',p:s=>[level(s.xp),3]},
  {id:'l5',e:'🏅',n:'Nivel 5',d:'Llegá al nivel 5',p:s=>[level(s.xp),5]},
  {id:'l10',e:'🏆',n:'Nivel 10',d:'Llegá al nivel 10',p:s=>[level(s.xp),10]},
  {id:'m1',e:'💸',n:'Primer movimiento',d:'Anotá un ingreso o gasto',p:s=>[s.money.length,1]},

/* ===== Hábitos: días, estados y rachas propias ===== */
const habitById = id => S.habits.find(h=>h.id===id);
function addDays(k,n){ const d = new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dkey(d); }
const wd = k => new Date(k+'T12:00:00').getDay();
// Días de la semana que tocaban ese día (el horario puede cambiar con el tiempo)
function daysFor(h,k){ let d = h.sched[0].days; for(const e of h.sched){ if(e.from<=k) d = e.days; else break; } return d; }
// 'done' hecho · 'skip' salteado · 'rest' no toca · 'pending' hoy, falta · 'missed' pasó y no se hizo · 'future' · 'none' antes de crearlo
function hstat(h,k){
  const t = dkey();
  if(k<h.since) return 'none';
  if(k>t) return 'future';
  if((S.done[k]||[]).includes(h.id)) return 'done';
  if((S.skip[k]||[]).includes(h.id)) return 'skip';
  if(!daysFor(h,k).includes(wd(k))) return 'rest';
  return k===t ? 'pending' : 'missed';
}
// Racha del hábito: días que tocaban y se cumplieron seguidos. Los días de descanso y salteados no la cortan.
function habitStreak(h){
  let st = 0, k = dkey();
  for(let i=0; i<800 && k>=h.since; i++){ const x = hstat(h,k); if(x==='done') st++; else if(x==='missed') break; k = addDays(k,-1); }
  return st;
}
function habitBest(h){
  let run = 0, best = 0, k = h.since; const t = dkey();
  for(let i=0; i<800 && k<=t; i++){ const x = hstat(h,k); if(x==='done'){ run++; if(run>best) best=run; } else if(x==='missed') run = 0; k = addDays(k,1); }
  return best;
}
const maxHabitBest = () => S.habits.reduce((m,h)=>Math.max(m,habitBest(h)),0);
// Hábitos que tocan hoy (o que ya hiciste hoy)
const dueToday = () => S.habits.filter(h=>{ const x = hstat(h,dkey()); return x==='done' || x==='pending'; });
function todayStats(){ const t = dkey(), due = dueToday(); return {tot:due.length, dn:due.filter(h=>(S.done[t]||[]).includes(h.id)).length}; }
function setStatus(id,k,to){
  const t = dkey(), was = (S.done[k]||[]).includes(id);
  S.done[k] = (S.done[k]||[]).filter(x=>x!==id); S.skip[k] = (S.skip[k]||[]).filter(x=>x!==id);
  if(was && k===t) removeXP(XP.habit);
  if(to==='done'){ S.done[k].push(id); if(k===t) addXP(XP.habit); else { toast('Anotado ✓'); checkBadges(); save(); } }
  else if(to==='skip'){ S.skip[k].push(id); toast('Día salteado: no corta la racha'); save(); }
  else save();
}
function setHabitDays(h,days){
  const t = dkey(), last = h.sched[h.sched.length-1];
  if(last.from===t) last.days = days; else h.sched.push({from:t,days});
}

/* ===== Racha ===== */
function reconcile(){
  if(!S.lastActive) return;
  const gap = dayNum(dkey()) - dayNum(S.lastActive) - 1;
  if(gap>0){
    if(S.freezes>=gap){ S.freezes-=gap; S.lastActive = dkey(new Date(Date.now()-864e5)); setTimeout(()=>toast('🧊 Un congelador salvó tu racha'),600); }
    else S.streak = 0;
  }
}

function addXP(n, msg){
  petMsg = null;
  const today = dkey(), before = level(S.xp); let bonus = 0;
  if(S.lastActive !== today){
    S.streak += 1; S.lastActive = today; bonus = XP.first;
    if(!S.activeDays.includes(today)) S.activeDays.push(today);
    if(S.streak>S.best) S.best = S.streak;
    if(S.streak%7===0 && S.freezes<2){ S.freezes++; popup({e:'🧊',t:'¡Congelador ganado!',d:'Te salva la racha si un día no podés.'}); }
  }
  S.xp = Math.max(0, S.xp+n+bonus);
  toast(msg || ('+'+(n+bonus)+' XP')); buzz();
  const lv = level(S.xp);
  if(lv>before){
    const un = ACCS.filter(a=>a.lv>before && a.lv<=lv).map(a=>a.e+' '+a.n);
    popup({e:'⭐',t:'¡Nivel '+lv+'!',d:title(lv)+(un.length?' · Desbloqueaste: '+un.join(', '):'')});
  }
  checkBadges(); save();
}

const fmtDay = k => new Date(k+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
function taskWhen(x){
  const t = dkey(), hh = x.time ? ' · '+x.time : '';
  if(!x.date) return {txt:'Sin fecha',cls:''};
  if(x.date<t) return {txt:'Vencida · '+fmtDay(x.date)+hh,cls:'neg'};
  if(x.date===t) return {txt:'Hoy'+hh,cls:'pos'};
  if(x.date===addDays(t,1)) return {txt:'Mañana'+hh,cls:''};
  return {txt:fmtDay(x.date)+hh,cls:''};
}
const taskKey = x => (x.date||'9999-99-99')+' '+(x.time||'99:99');
const openTasks = () => S.tasks.filter(x=>!x.done).sort((a,b)=>taskKey(a)<taskKey(b)?-1:taskKey(a)>taskKey(b)?1:0);

function plus1h(date,time){ const e = new Date(date+'T'+time+':00'); e.setHours(e.getHours()+1); return dkey(e).replace(/-/g,'')+'T'+String(e.getHours()).padStart(2,'0')+String(e.getMinutes()).padStart(2,'0')+'00'; }
function gcalUrl(x){
  const d = x.date.replace(/-/g,'');
  const dates = x.time ? d+'T'+x.time.replace(':','')+'00/'+plus1h(x.date,x.time) : d+'/'+addDays(x.date,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.text)+'&dates='+dates;
}
function buildIcs(list){
  const ic = t => String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Racha//ES','CALSCALE:GREGORIAN'];
  list.forEach(x=>{
    const d = x.date.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:'+x.id+'@racha','DTSTAMP:'+stamp);
    if(x.time) L.push('DTSTART:'+d+'T'+x.time.replace(':','')+'00','DTEND:'+plus1h(x.date,x.time));
    else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addDays(x.date,1).replace(/-/g,''));
    L.push('SUMMARY:'+ic(x.text),'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function downloadIcs(list){
  const url = URL.createObjectURL(new Blob([buildIcs(list)],{type:'text/calendar'})), a = document.createElement('a');
  a.href = url; a.download = 'tareas.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast('📤 Archivo listo');
}

   <div class="amts"><button class="amt ${qf==='a'||!diff?'on':''}" data-a="qf" data-v="a"><span class="mut">Enviás</span><small>${sym(cur)}</small>${fmtAmount(qa)}</button>
   ${diff?`<button class="amt ${qf==='b'?'on':''}" data-a="qf" data-v="b"><span class="mut">Recibís</span><small>${sym(to.cur)}</small>${fmtAmount(qb)}</button>`:''}</div>
   <div class="rate">${rate}</div>

   <button class="btn blue" data-a="addm">Guardar pasaje</button>`;
  } else {
    form = `${seg}
   ${S.accounts.length>1?`<div class="chips">${S.accounts.map(a=>accChip(a,'qacc')).join('')}</div>`:''}
   <div class="amount"><small>${sym(cur)}</small>${fmtAmount()}</div>
   <div class="chips">${S.cats[qt].map(c=>`<button class="chip ${qc===c.name?'on':''}" data-a="qc" data-v="${esc(c.name)}">${esc(c.e)} ${esc(c.name)}</button>`).join('')}</div>
   ${padHtml}

  <h2>Mis cuentas</h2><div class="card">${S.accounts.map(a=>`<div class="mv"><div style="font-size:22px">${esc(a.e)}</div><div class="t"><div>${esc(a.name)}</div><span class="mut">${a.cur}</span></div><b class="${bal(a)<0?'neg':''}">${money(bal(a),a.cur)}</b></div>`).join('')}</div>
  ${summary}
  ${cats.length?`<h2>Gastos del mes por categoría · ${cur}</h2><div class="card">${cats.map(([n,v])=>`<div class="cat"><span style="width:110px">${catE(n,'gas')} ${esc(n)}</span><div class="bar"><i style="width:${v/cats[0][1]*100}%"></i></div><b>${money(v,cur)}</b></div>`).join('')}</div>`:''}
  <h2>Últimos movimientos</h2><div class="card">${list.length?list.map(m=>{
    if(m.tipo==='tr'){ const f = accOf(m.acc), t = accOf(m.to); const same = f.cur===t.cur;
      return `<div class="mv"><div style="font-size:22px">🔁</div><div class="t"><div>${esc(f.e)} ${esc(f.name)} → ${esc(t.e)} ${esc(t.name)}</div><span class="mut">${esc(m.date)} · Pasaje${m.desc?' · '+esc(m.desc):''}</span></div><b style="color:var(--blue);text-align:right">${money(m.monto,f.cur)}${same?'':'<br>→ '+money(m.recibido,t.cur)}</b><button class="ghost" data-a="delm" data-id="${m.id}" aria-label="Borrar">✕</button></div>`; }
    const a = accOf(m.acc); return `<div class="mv"><div style="font-size:22px">${catE(m.cat,m.tipo)}</div><div class="t"><div>${esc(m.desc||m.cat)}</div><span class="mut">${esc(m.date)} · ${esc(m.cat)} · ${esc(a.e)} ${esc(a.name)}</span></div><b class="${m.tipo==='ing'?'pos':'neg'}">${m.tipo==='ing'?'+':'-'}${money(m.monto,a.cur)}</b><button class="ghost" data-a="delm" data-id="${m.id}" aria-label="Borrar">✕</button></div>`; }).join(''):'<p class="mut">Todavía no anotaste nada. Cuando tengas un gasto o un ingreso, cargalo arriba 👆</p>'}</div>`;

const MN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const monthIdx = d => Number(d.slice(0,4))*12 + Number(d.slice(5,7)) - 1;
const PERIODS = [['mes','Este mes'],['pas','Mes pasado'],['tres','3 meses'],['anio','Este año'],['todo','Todo']];
function periodOf(p){
  const now = new Date(), cur = now.getFullYear()*12 + now.getMonth();
  if(p==='mes')  return {s:cur,   n:1, prev:{s:cur-1,n:1}, prevLabel:'el mes pasado'};
  if(p==='pas')  return {s:cur-1, n:1, prev:{s:cur-2,n:1}, prevLabel:'el mes anterior'};
  if(p==='tres') return {s:cur-2, n:3, prev:{s:cur-5,n:3}, prevLabel:'los 3 meses anteriores'};
  if(p==='anio'){ const n = now.getMonth()+1; return {s:cur-(n-1), n, prev:{s:cur-(n-1)-12,n}, prevLabel:'el mismo período del año pasado'}; }
  const idx = S.money.map(m=>monthIdx(m.date)), s0 = idx.length ? Math.min(...idx) : cur;
  return {s:s0, n:cur-s0+1, prev:null};
}
function plata(){
  const tab = (k,l) => `<button class="t ${pv===k?'on':''}" data-a="pv" data-v="${k}">${l}</button>`;
  return BACK+`<div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:8px">${tab('anotar','✍️ Anotar')}${tab('informes','📊 Informes')}</div>` + (pv==='informes' ? informes() : anotar());
}
function informes(){
  const accOf = id => S.accounts.find(a=>a.id===id) || {cur:'ARS'};
  const curs = [...new Set(S.accounts.map(a=>a.cur))];
  if(!curs.includes(rc)) rc = curs[0];
  const P = periodOf(rp), nowD = new Date(), curIdx = nowD.getFullYear()*12 + nowD.getMonth();
  const inP = (m,q) => { const i = monthIdx(m.date); return i>=q.s && i<q.s+q.n; };
  const mine = S.money.filter(m=>m.tipo!=='tr' && accOf(m.acc).cur===rc);
  const now = mine.filter(m=>inP(m,P)), before = P.prev ? mine.filter(m=>inP(m,P.prev)) : null;
  const sum = (arr,t) => arr.reduce((x,m)=>m.tipo===t?x+m.monto:x,0);
  const ing = sum(now,'ing'), gas = sum(now,'gas'), bal = ing-gas;
  const catE = (n,t) => ((S.cats[t]||[]).find(c=>c.name===n) || S.cats.gas.concat(S.cats.ing).find(c=>c.name===n) || {e:'🧾'}).e;
  const chips = `<div class="chips">${PERIODS.map(([k,l])=>`<button class="chip ${rp===k?'on':''}" data-a="rp" data-v="${k}">${l}</button>`).join('')}</div>`
    + (curs.length>1 ? `<div class="chips">${curs.map(c=>`<button class="chip ${rc===c?'on':''}" data-a="rc" data-v="${c}">${c==='USD'?'💲 Dólares':'💵 Pesos'}</button>`).join('')}</div>` : '');
  if(!now.length) return chips + `<div class="card" style="text-align:center"><div style="font-size:42px">📭</div><b>Sin movimientos en este período</b><p class="mut">Anotá gastos e ingresos y acá vas a ver tus informes.</p><button class="btn blue" data-a="pv" data-v="anotar">Anotar un movimiento</button></div>`;

  // Comparación con el período anterior
  const pct = (a,b) => b>0 ? Math.round((a-b)/b*100) : null;
  const cmp = (verbo,a,b,badWhenUp) => { if(!before) return ''; const p = pct(a,b); if(p===null) return '';
    if(p===0) return `<div class="mut">${verbo} lo mismo que ${P.prevLabel}</div>`;
    const bad = (p>0)===badWhenUp; return `<div class="${bad?'neg':'pos'}" style="font-size:13px">${verbo} ${Math.abs(p)}% ${p>0?'más':'menos'} que ${P.prevLabel}</div>`; };
  const saving = ing>0 ? (bal>=0 ? `<div class="pos" style="font-size:13px">Ahorraste el ${Math.round(bal/ing*100)}% de lo que ganaste</div>` : `<div class="neg" style="font-size:13px">Gastaste más de lo que ganaste</div>`) : '';
  const days = P.n===1 ? (P.s===curIdx ? nowD.getDate() : new Date(Math.floor(P.s/12), P.s%12+1, 0).getDate()) : 0;
  const avgLabel = P.n===1 ? 'gasto por día' : 'gasto por mes', avg = P.n===1 ? gas/days : gas/P.n;

  // Gráfico
  let chart;
  if(P.n===1){
    const dim = new Date(Math.floor(P.s/12), P.s%12+1, 0).getDate(), d = Array(dim).fill(0);
    now.forEach(m=>{ if(m.tipo==='gas') d[Number(m.date.slice(8,10))-1]+=m.monto; });
    const mx = Math.max(...d,1);
    chart = `<b>Gasto por día</b><div class="cols days">${d.map((v,i)=>`<div class="col" title="Día ${i+1}: ${money(v,rc)}"><i class="g" style="height:${v?Math.max(4,v/mx*100):0}%"></i></div>`).join('')}</div><div class="mut" style="display:flex;justify-content:space-between;margin-top:4px"><span>1</span><span>${Math.ceil(dim/2)}</span><span>${dim}</span></div>`;
  } else {
    const idxs = []; for(let i=P.s;i<P.s+P.n;i++) idxs.push(i);
    const shown = idxs.slice(-12).map(i=>{ const mm = now.filter(m=>monthIdx(m.date)===i); return {i, ing:sum(mm,'ing'), gas:sum(mm,'gas')}; });
    const mx = Math.max(...shown.map(x=>Math.max(x.ing,x.gas)),1);
    const h = v => v ? Math.max(4,v/mx*100) : 0;
    chart = `<b>Ingresos y gastos por mes</b><div class="legend"><span><b style="background:var(--green)"></b>Ingresos</span><span><b style="background:var(--red)"></b>Gastos</span></div>
      <div class="cols">${shown.map(x=>`<div class="col" title="${MN[x.i%12]}: ingresos ${money(x.ing,rc)}, gastos ${money(x.gas,rc)}"><i class="i" style="height:${h(x.ing)}%"></i><i class="g" style="height:${h(x.gas)}%"></i></div>`).join('')}</div>
      <div class="labs">${shown.map(x=>`<span>${MN[x.i%12]}</span>`).join('')}</div>`;
  }

  // Rankings
  const rank = t => { const o = {}; now.filter(m=>m.tipo===t).forEach(m=>{ o[m.cat]=(o[m.cat]||0)+m.monto; }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const rankHtml = (arr,total,t) => arr.slice(0,6).map(([n,v],i)=>`<div class="cat ${t}"><span style="width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i+1}. ${catE(n,t)} ${esc(n)}</span><div class="bar"><i style="width:${v/arr[0][1]*100}%"></i></div><b>${money(v,rc)}</b><span class="mut" style="width:34px;text-align:right">${Math.round(v/total*100)}%</span></div>`).join('')
    + (arr.length>6 ? `<div class="mut" style="margin-top:4px">y ${arr.length-6} categoría${arr.length-6>1?'s':''} más</div>` : '');
  const rg = rank('gas'), ri = rank('ing');
  const big = now.filter(m=>m.tipo==='gas').sort((a,b)=>b.monto-a.monto).slice(0,5);

  return `${chips}
  <div class="card"><div class="stats">
    <div><b class="pos">${money(ing,rc)}</b><span class="mut">ingresos</span></div>
    <div><b class="neg">${money(gas,rc)}</b><span class="mut">gastos</span></div>
    <div><b class="${bal<0?'neg':''}">${money(bal,rc)}</b><span class="mut">balance</span></div>
    <div><b>${money(Math.round(avg*100)/100,rc)}</b><span class="mut">${avgLabel}</span></div></div>
    <div style="margin-top:10px;display:grid;gap:3px">${cmp('Gastaste',gas,before?sum(before,'gas'):0,true)}${cmp('Ganaste',ing,before?sum(before,'ing'):0,false)}${saving}</div></div>
  <div class="card">${chart}</div>
  ${rg.length?`<h2>Tus principales gastos</h2><div class="card">${rankHtml(rg,gas,'gas')}</div>`:''}
  ${ri.length?`<h2>Tus principales ingresos</h2><div class="card">${rankHtml(ri,ing,'ing')}</div>`:''}
  ${big.length?`<h2>Los gastos más grandes</h2><div class="card">${big.map(m=>`<div class="mv"><div style="font-size:22px">${catE(m.cat,'gas')}</div><div class="t"><div>${esc(m.desc||m.cat)}</div><span class="mut">${esc(m.date)} · ${esc(m.cat)}</span></div><b class="neg">${money(m.monto,rc)}</b></div>`).join('')}</div>`:''}
  <p class="mut" style="text-align:center">Los pasajes entre cuentas no cuentan como gastos ni ingresos.</p>`;
}

   + `<button class="btn dim" data-a="addcat" data-k="${k}" data-focus='[data-f="cn"][data-k="${k}"]'>+ Nueva categoría</button>`;

function ajustes(){

    return sub+`<h1>🌱 Hábitos</h1><div class="card">${hab||'<p class="mut">No tenés hábitos todavía.</p>'}<button class="btn blue" data-a="addhab" data-focus='[data-f="hn"]'>+ Nuevo hábito</button>
     <p class="mut" style="margin:10px 0 0">Elegí qué días te toca cada uno. Si borrás un hábito, deja de aparecer en tus misiones, pero lo que ya hiciste cuenta igual.</p></div>`;

     <div class="er"><span class="mut" style="flex:none">Saldo inicial</span><input class="n" type="text" inputmode="decimal" data-f="ab" data-id="${a.id}" value="${a.init||0}"></div></div>`).join('');
    return sub+`<h1>💰 Transferencias</h1>
    <h2>Cuentas</h2><div class="card">${accs}<button class="btn blue" data-a="addacc" data-focus='[data-f="an"]'>+ Nueva cuenta</button>

    <h2>Categorías de ingresos</h2><div class="card">${catRows('ing')}</div>`;
  }
  return sub+`<h1>🛠️ General</h1>

   ${deferredPrompt?'<button class="btn blue" data-a="install">Instalar ahora</button>':''}</div>

  <p style="text-align:center"><button class="ghost" data-a="reset">Borrar todo y empezar de cero</button></p>`;
}

document.addEventListener('input', e=>{ if(e.target.id==='qd') qd = e.target.value; if(e.target.id==='hq-amt') hqA = e.target.value; });
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id, t = dkey();
  if(a==='none') return;
  if(a==='go') return go(b.dataset.v);
  if(a==='closem') return nextModal();
  if(a==='th'){
    const dn = S.done[t] = S.done[t]||[];
    if(dn.includes(id)){ S.done[t] = dn.filter(x=>x!==id); removeXP(XP.habit); }
    else { S.skip[t] = (S.skip[t]||[]).filter(x=>x!==id); dn.push(id); addXP(XP.habit); }
  }
  else if(a==='addhab'){ S.habits.push(newHabit(uid(),'Nuevo hábito','✨')); save(); }
  else if(a==='delh'){ if(!confirm('¿Borrar este hábito? Tu historial se mantiene.')) return; S.habits=S.habits.filter(h=>h.id!==id); save(); }
  else if(a==='mvh'){ const i=S.habits.findIndex(h=>h.id===id), j=i+Number(b.dataset.d); if(i<0||j<0||j>=S.habits.length) return; [S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]]; save(); }
  else if(a==='addacc'){ S.accounts.push({id:uid(),name:'Nueva cuenta',e:'🏦',cur:'ARS',init:0}); save(); }
  else if(a==='delacc'){
    if(S.money.some(m=>m.acc===id||m.to===id)){ toast('Esa cuenta tiene movimientos'); return; }
    if(S.accounts.length<=1){ toast('Dejá al menos una cuenta'); return; }
    if(!confirm('¿Borrar esta cuenta?')) return; S.accounts=S.accounts.filter(x=>x.id!==id); save();
  }
  else if(a==='addcat'){ const k=b.dataset.k; let n='Nueva', i=2; while(S.cats[k].some(c=>c.name===n)) n='Nueva '+i++; S.cats[k].push({id:uid(),name:n,e:'🏷️'}); save(); }
  else if(a==='delcat'){
    const k=b.dataset.k; if(S.cats[k].length<=1){ toast('Dejá al menos una categoría'); return; }
    if(!confirm('¿Borrar esta categoría? Los movimientos que ya anotaste la conservan.')) return; S.cats[k]=S.cats[k].filter(c=>c.id!==id); save();
  }
  else if(a==='pet'){ petSheep(); }
  else if(a==='tadd'){
    const tx = $('#t-text').value.trim(); if(!tx){ toast('Escribí la tarea'); return; }
    let d = $('#t-date').value; const tm = $('#t-time').value; if(tm && !d) d = t;
    S.tasks.push({id:uid(),text:tx,date:d||'',time:tm||'',done:false}); save(); toast('Tarea agregada ✓');
  }
  else if(a==='tq'){ $('#t-date').value = b.dataset.v==='' ? '' : addDays(t,Number(b.dataset.v)); return; }
  else if(a==='tdone'){ const x = S.tasks.find(q=>q.id===id); if(!x) return; x.done = !x.done; if(x.done) addXP(XP.task,'✅ Tarea hecha · +'+XP.task+' XP'); else { removeXP(XP.task); save(); } }
  else if(a==='tedit'){ editT = id; }
  else if(a==='tcancel'){ editT = ''; }
  else if(a==='tsave'){
    const x = S.tasks.find(q=>q.id===id), tx = $('#e-text').value.trim(); if(!x) return; if(!tx){ toast('Escribí la tarea'); return; }
    x.text = tx; x.date = $('#e-date').value; x.time = $('#e-time').value; if(x.time && !x.date) x.date = t;
    editT = ''; save(); toast('Guardado ✓');
  }
  else if(a==='tdel'){ if(!confirm('¿Borrar esta tarea?')) return; S.tasks = S.tasks.filter(q=>q.id!==id); save(); }
  else if(a==='texport'){ const list = S.tasks.filter(x=>!x.done && x.date); if(!list.length){ toast('No hay tareas con fecha para exportar'); return; } downloadIcs(list); return; }
  else if(a==='ajs'){ ajs = b.dataset.v; window.scrollTo(0,0); }
  else if(a==='goaj'){ view = 'ajustes'; ajs = b.dataset.s; petMsg = null; render(); window.scrollTo(0,0); return; }
  else if(a==='hqt'){ hqT = b.dataset.v; hqCat = ''; fixH(); }
  else if(a==='hqsave'){
    const monto = parseNum(hqA);
    if(!(monto>0)){ toast('Poné un monto'); return; }
    fixH(); commitMove(hqT,monto,hqCat,hqAcc,''); hqA = '';
  }
  else if(a==='hday'){
    const h = habitById(id), d = Number(b.dataset.d), cur = daysFor(h,dkey());
    const next = cur.includes(d) ? cur.filter(x=>x!==d) : cur.concat(d).sort();
    if(!next.length){ toast('Dejá al menos un día'); return; }
    setHabitDays(h,next); save(); toast('Guardado ✓');
  }
  else if(a==='hsel'){ hsel = id; hm = 0; }
  else if(a==='hm'){ hm = Math.min(0, hm+Number(b.dataset.d)); }
  else if(a==='cal'){ const h = habitById(id), k = b.dataset.k, x = hstat(h,k); setStatus(h.id,k, x==='done'?'skip' : x==='skip'?'none' : 'done'); }
  else if(a==='pv'){ pv=b.dataset.v; window.scrollTo(0,0); }
  else if(a==='rp'){ rp=b.dataset.v; }
  else if(a==='rc'){ rc=b.dataset.v; }
  else if(a==='qacc'){ qacc=b.dataset.v; fixQ(); if(qt==='tr'){ qb=''; qbAuto=true; qf='a'; autoRecv(); } }
  else if(a==='qto'){ qto=b.dataset.v; qb=''; qbAuto=true; qf='a'; autoRecv(); }
  else if(a==='qf'){ qf=b.dataset.v; }
  else if(a==='chest'){ if(S.chest[t]) return; S.chest[t]=true; S.chests++; confetti(); addXP(XP.chest,'🎁 +'+XP.chest+' XP del cofre'); }
  else if(a==='addi'){ const v=$('#ni').value.trim(); if(!v) return; S.intentions.push({id:uid(),text:v,date:t,done:false}); save(); }
  else if(a==='thx'){ const x=S.intentions.find(q=>q.id===id); if(x){ x.done=true; save(); toast('🙌 Gracias, Señor'); } }
  else if(a==='deli'){ if(!confirm('¿Borrar esta intención?')) return; S.intentions=S.intentions.filter(q=>q.id!==id); save(); }
  else if(a==='qt'){ qt=b.dataset.v; qc=''; fixQ(); if(qt==='tr'){ qb=''; qbAuto=true; qf='a'; autoRecv(); } }
  else if(a==='qc'){ qc=b.dataset.v; }
  else if(a==='key'){
    const k=b.dataset.k; buzz();
    const useB = qf==='b' && trDiff();
    let v = useB ? qb : qa;
    if(k==='⌫') v=v.slice(0,-1);
    else if(k===','){ if(!v.includes(',')) v=(v||'0')+','; }
    else { const d=v.split(',')[1]; if((v.replace(',','').length<10) && !(v.includes(',') && d.length>=2)) v = v==='0'?k:v+k; }
    if(useB){ qb=v; qbAuto=false; } else { qa=v; autoRecv(); }
  }
  else if(a==='addm' && qt==='tr'){
    fixQ(); const from=acctById(qacc), to=acctById(qto);
    if(!to || to.id===from.id){ toast('Necesitás dos cuentas distintas (Ajustes)'); return; }
    const sent=num(qa), recv = from.cur===to.cur ? sent : num(qb);
    if(!(sent>0)){ toast('Poné un monto'); return; }
    if(!(recv>0)){ toast('Poné cuánto recibís'); return; }
    const firstToday = S.money.filter(m=>m.date===t).length < 3;
    S.money.push({id:uid(),date:t,tipo:'tr',acc:from.id,to:to.id,monto:sent,recibido:recv,cat:'Pasaje',desc:qd.trim()});
    if(from.cur!==to.cur) S.rate = from.cur==='ARS' ? sent/recv : recv/sent;
    qa=''; qb=''; qd=''; qbAuto=true; qf='a';
    if(firstToday) addXP(XP.money,'🔁 Pasaje guardado · +'+XP.money+' XP'); else { toast('Pasaje guardado ✓'); checkBadges(); save(); }
  }
  else if(a==='addm'){
    const monto = parseFloat(qa.replace(',','.'));
    if(!(monto>0)){ toast('Poné un monto'); return; }
    fixQ(); commitMove(qt,monto,qc,qacc,qd.trim());
    qa=''; qd='';
  }
  else if(a==='delm'){ if(!confirm('¿Borrar este movimiento?')) return; S.money=S.money.filter(m=>m.id!==id); save(); }
  else if(a==='addg'){
    const first = !S.gym.some(g=>g.date===t);
    S.gym.push({date:t,tipo:$('#gt').value,nota:$('#gn').value.trim()});
    if(first) addXP(XP.gym,'💪 Entreno guardado · +'+XP.gym+' XP'); else { toast('Guardado ✓'); checkBadges(); save(); }
  }
  else if(a==='meal'){
    const m = S.meals[t] = S.meals[t]||{}, k=b.dataset.k;
    if(m[k]){ m[k]=false; removeXP(XP.meal); } else { m[k]=true; addXP(XP.meal); }
  }
  else if(a==='bdinfo'){ const bd=BADGES.find(x=>x.id===id), own=S.badges.includes(id), [c,tg]=bd.p(S); toast(bd.n+': '+bd.d+(own?' ✓':' ('+Math.min(c,tg)+'/'+tg+')')); return; }
  else if(a==='eq'){ const ac=ACCS.find(x=>x.id===id); S.eq[ac.slot] = S.eq[ac.slot]===id ? '' : id; save(); }
  else if(a==='install'){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; } }
  else if(a==='export'){
    const txt = JSON.stringify(S);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('📋 Copia guardada en el portapapeles'),()=>prompt('Copiá este texto y guardalo:',txt));
    return;
  }
  else if(a==='import'){
    const txt = prompt('Pegá acá tu copia de seguridad (reemplaza lo actual):'); if(!txt) return;
    try{ const o=JSON.parse(txt); if(typeof o!=='object'||!o||typeof o.xp!=='number') throw 0; S=Object.assign(fresh(),o); migrate(); save(); toast('✅ Datos restaurados'); }catch(err){ toast('Ese texto no es una copia válida'); return; }
  }
  else if(a==='reset'){ if(confirm('Se borra todo tu progreso. ¿Seguro?')){ S=fresh(); save(); } }
  render();
  if(a==='pet'){ const sv=document.querySelector('.sheep'); if(sv){ sv.classList.add('boing'); sv.addEventListener('animationend',()=>sv.classList.remove('boing'),{once:true}); } }
  if(b.dataset.focus){ const els=document.querySelectorAll(b.dataset.focus), l=els[els.length-1]; if(l){ l.focus(); l.select(); } }
});
document.addEventListener('change', e=>{
  const el=e.target, f=el.dataset.f;
  if(el.id==='hq-cat'){ hqCat = el.value; return; }
  if(el.id==='hq-acc'){ hqAcc = el.value; render(); return; }
  if(!f) return;
  const id=el.dataset.id, v=el.value.trim(), k=el.dataset.k;
  const H=S.habits.find(x=>x.id===id), A=S.accounts.find(x=>x.id===id), C=k&&S.cats[k]?S.cats[k].find(x=>x.id===id):null;
  const empty = old => { el.value=old; toast('No puede quedar vacío'); };
  if(f==='hn'&&H){ if(!v) return empty(H.name); H.name=v; }
  else if(f==='he'&&H){ H.e=v||'✨'; el.value=H.e; }
  else if(f==='an'&&A){ if(!v) return empty(A.name); A.name=v; }
  else if(f==='ae'&&A){ A.e=v||'🏦'; el.value=A.e; }
  else if(f==='ac'&&A){ A.cur=el.value==='USD'?'USD':'ARS'; }
  else if(f==='ab'&&A){ const n = parseNum(v); A.init = isFinite(n) ? n : 0; el.value = String(A.init).replace('.',','); }
  else if(f==='ce'&&C){ C.e=v||'🏷️'; el.value=C.e; }
  else if(f==='cn'&&C){
    if(!v) return empty(C.name);
    if(S.cats[k].some(x=>x!==C && x.name.toLowerCase()===v.toLowerCase())){ el.value=C.name; return toast('Ya existe esa categoría'); }
    S.money.forEach(m=>{ if(m.tipo===k && m.cat===C.name) m.cat=v; });
    if(qt===k && qc===C.name) qc=v;
    C.name=v;
  } else return;
  save(); toast('Guardado ✓');
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const map={ni:'addi','hq-amt':'hqsave','t-text':'tadd'}; const a = map[e.target.id];
  if(a) document.querySelector('[data-a="'+a+'"]').click();
});

reconcile(); checkBadges(); save(); render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
